[package]
name = "hearth-ffi"
version = "0.0.0"  # the owner picks version numbers; this one isn't shipped on its own
description = "The bridge between Hearth Engine (C++) and its Rust parts: Hearth Script and Hearth Detail, as a C interface"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# staticlib: linked into the engine's HearthRust gem; rlib: for the tests here.
crate-type = ["staticlib", "rlib"]

[dependencies]
hearth-script = { path = "../hearth-script" }
hearth-detail = { path = "../hearth-detail" }
hearth-texture = { path = "../hearth-texture" }
serde_json = "1"
