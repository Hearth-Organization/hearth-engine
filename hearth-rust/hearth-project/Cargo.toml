[package]
name = "hearth-project"
version = "0.0.0"  # the owner picks version numbers; this one isn't shipped on its own
description = "Hearth Engine's project and gem tools in Rust (replacing O3DE's Python o3de scripts): find the engine, list, check, enable and disable gems safely"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hearth-project"
path = "src/main.rs"

[dependencies]
hearth-save = { path = "../hearth-save" }
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"
