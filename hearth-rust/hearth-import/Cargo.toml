[package]
name = "hearth-import"
version = "0.0.0"  # the owner picks version numbers; this one isn't shipped on its own
description = "Hearth Engine's import checks: looks a model over before it goes in the game and says what's wrong in plain words"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hearth-import"
path = "src/main.rs"

[dependencies]
hearth-detail = { path = "../hearth-detail" }
serde_json = "1"
