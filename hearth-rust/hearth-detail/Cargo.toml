[package]
name = "hearth-detail"
version = "0.0.0"  # the owner picks version numbers; this one isn't shipped on its own
description = "Hearth Engine's Nanite-style detail: splits a model into small pieces with simpler versions, so the game draws full detail up close and less far away, with no cracks"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hearth-detail"
path = "src/bin/hearth-detail.rs"

[dependencies]
serde_json = "1"
