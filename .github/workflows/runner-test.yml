# Quick check that a paid larger runner will start. Runs only when this file changes.
name: Runner test (larger runners)

on:
  push:
    branches: [ "hearth/main" ]
    paths: [ ".github/workflows/runner-test.yml" ]

jobs:
  test32:
    runs-on: hearth-32
    timeout-minutes: 5
    steps:
      - run: echo "hearth-32 is working, $(nproc) cores, $(free -g | awk '/Mem/{print $2}') GB RAM"
