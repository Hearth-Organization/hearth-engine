# Hearth Engine: build the Linux engine SDK on GitHub and publish it as a release.
#
# The laptop then downloads the SDK (the Hearth Engine agent does this) and only has to build each
# game's own code, which takes minutes. The build keeps its compiler cache between runs, so if one run
# hits GitHub's 6-hour limit, the next run continues from where it got to (push again, or run it by hand).

name: Hearth Engine SDK (Linux)

on:
  push:
    branches: [ "hearth/main" ]
    paths-ignore: [ "HEARTH.md", "**/*.md" ]
  workflow_dispatch:

concurrency:
  group: hearth-sdk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sdk:
    # Free 4-core GitHub machine. For the paid 96-core one, use: runs-on: hearth-96 (and timeout-minutes 90 / 75).
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_COMPRESS: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CC: clang
      CXX: clang++
    steps:
      - name: Make room on the build machine
        # Delete the big preinstalled toolchains we never use. (Plain commands: the old disk-splitting
        # action left the main disk full on GitHub's current machines.)
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /usr/local/julia* \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/az /opt/microsoft /opt/google || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile /swapfile || true
          # Put the build folder on the second disk when there is one with room.
          if [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -gt 30 ]; then
            sudo mkdir -p /mnt/hearth-build && sudo chown "$USER" /mnt/hearth-build
            echo "HEARTH_BUILD_DIR=/mnt/hearth-build" >> "$GITHUB_ENV"
          else
            echo "HEARTH_BUILD_DIR=$GITHUB_WORKSPACE/build/linux" >> "$GITHUB_ENV"
          fi
          df -h / /mnt || true

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          show-progress: false

      - name: Large files (Git LFS)
        id: lfs
        run: |
          git lfs install
          git lfs pull

      - name: Build tools and libraries
        id: apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang lld mold ccache pkg-config \
            libglu1-mesa-dev libxcb-xinerama0 libxcb-xinput0 libxcb-xinput-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libcurl4-openssl-dev zlib1g-dev \
            mesa-common-dev libssl-dev libunwind-dev libzstd-dev libwayland-dev zstd \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-cursor-dev libxcb-xinerama0-dev \
            libxrandr-dev libxi-dev libxext-dev libxcursor-dev libxinerama-dev libpcre2-dev
          cmake --version
          clang --version | head -1
          df -h "$GITHUB_WORKSPACE"

      - name: Restore compiler cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ccache
          key: hearth-ccache-${{ github.sha }}
          restore-keys: hearth-ccache-

      - name: Configure
        id: configure
        run: |
          set -o pipefail
          mkdir -p "$HOME/.o3de/3rdParty"
          cmake -S . -B "$HEARTH_BUILD_DIR" -G "Ninja Multi-Config" \
            -DLY_3RDPARTY_PATH="$HOME/.o3de/3rdParty" \
            -DLY_VERSION_ENGINE_NAME=hearth-engine \
            -DLY_DISABLE_TEST_MODULES=ON \
            -DLY_STRIP_DEBUG_SYMBOLS=ON \
            -DLY_UNITY_BUILD=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_LINKER_TYPE=MOLD \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" 2>&1 | tee configure.log

      - name: Build and install the SDK
        id: build
        # Stop a little before GitHub's limit so the compiler cache still gets saved for the next run.
        timeout-minutes: 300
        run: |
          set -o pipefail
          cmake --build "$HEARTH_BUILD_DIR" --config profile --target install -j "$(nproc)" 2>&1 | tee build.log
        continue-on-error: true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ccache
          key: hearth-ccache-${{ github.sha }}-${{ github.run_attempt }}

      - name: Report progress
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ccache --show-stats || true
          step=$(grep -o '^\[[0-9]*/[0-9]*\]' build.log | tail -1 || true)
          outcome="${{ steps.build.outcome }}"
          {
            echo "Run ${{ github.run_number }} (attempt ${{ github.run_attempt }}) on ${{ github.sha }}"
            echo "Outcome: ${outcome}  Last step: ${step}"
            df -h / /mnt 2>/dev/null || true
            echo "Steps: lfs=${{ steps.lfs.outcome }} apt=${{ steps.apt.outcome }} configure=${{ steps.configure.outcome }} build=${{ steps.build.outcome }}"
            if [ "${{ steps.configure.outcome }}" = "failure" ]; then echo "== configure (errors) =="; grep -n -B2 -A8 "CMake Error" configure.log | head -80; echo "== configure (end) =="; tail -40 configure.log; fi
            echo
            grep -E "error:|FAILED:" build.log | head -40 || true
            echo
            tail -60 build.log || true
          } > build-status.txt
          gh release delete hearth-sdk-status --yes --cleanup-tag 2>/dev/null || true
          gh release create hearth-sdk-status build-status.txt --prerelease \
            --title "SDK build status: ${outcome} ${step}" \
            --notes "Latest Hearth Engine SDK build: ${outcome}, last step ${step}. See build-status.txt."

      - name: Package and publish the SDK
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hearth-sdk-linux-${{ github.run_number }}"
          tar -C install -cf - . | zstd -T0 -12 -o hearth-engine-sdk-linux.tar.zst
          split -b 1900M -d hearth-engine-sdk-linux.tar.zst hearth-engine-sdk-linux.tar.zst.part
          sha256sum hearth-engine-sdk-linux.tar.zst > hearth-engine-sdk-linux.sha256
          ls -lh hearth-engine-sdk-linux.tar.zst*
          gh release create "$tag" hearth-engine-sdk-linux.tar.zst.part* hearth-engine-sdk-linux.sha256 \
            --title "Hearth Engine SDK (Linux) ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }} on branch hearth/main. Download all parts, join them, check the sha256, unpack."
